name: Build Fabric Mod

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Find and Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found anywhere in the repository!"
          exit 1
        fi
        GRADLE_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found gradlew in directory: $GRADLE_DIR"
        chmod +x "$GRADLEW_PATH"
        cd "$GRADLE_DIR"
        ./gradlew build

    - name: Upload Artifact (Compiled JAR)
      uses: actions/upload-artifact@v4
      with:
        name: MuteGui-1.21.11-JAR
        path: '**/build/libs/*.jar'
